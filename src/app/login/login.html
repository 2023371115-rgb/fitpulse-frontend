<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Sketchbook</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #1a1a1d;
      --border: #2e2e33;
      --accent: #7c6cfc;
      --accent-hover: #6b5aeb;
      --text: #e8e8ed;
      --muted: #888898;
      --error: #ff5f6d;
      --success: #4caf7d;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    .tabs {
      display: flex;
      gap: 0;
      background: var(--bg);
      border-radius: var(--radius);
      padding: 3px;
      margin-bottom: 2rem;
    }
    .tab {
      flex: 1;
      padding: .55rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
    }
    .tab.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .form { display: flex; flex-direction: column; gap: 1rem; }
    .form.hidden { display: none; }

    label {
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: .3rem;
      display: block;
    }

    input {
      width: 100%;
      padding: .75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .9rem;
      font-family: var(--font);
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: .8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .2s, transform .1s;
      font-family: var(--font);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .message {
      font-size: .83rem;
      padding: .65rem 1rem;
      border-radius: 8px;
      display: none;
    }
    .message.error { background: rgba(255,95,109,.1); color: var(--error); border: 1px solid rgba(255,95,109,.2); display: block; }
    .message.success { background: rgba(76,175,125,.1); color: var(--success); border: 1px solid rgba(76,175,125,.2); display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">sketch<span>book</span></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="tab" onclick="switchTab('register')">Crear cuenta</button>
    </div>

    <div id="msg" class="message"></div>

    <!-- LOGIN -->
    <div id="loginForm" class="form">
      <div>
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email" />
      </div>
      <div>
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn" onclick="login()">Entrar</button>
    </div>

    <!-- REGISTRO -->
    <div id="registerForm" class="form hidden">
      <div>
        <label>Nombre</label>
        <input type="text" id="regName" placeholder="Tu nombre" autocomplete="name" />
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="tu@email.com" autocomplete="email" />
      </div>
      <div>
        <label>Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
      </div>
      <button class="btn" onclick="register()">Crear cuenta</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.tab');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      tabs[0].classList.toggle('active', tab === 'login');
      tabs[1].classList.toggle('active', tab === 'register');
      showMsg('', '');
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'message' + (type ? ' ' + type : '');
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return showMsg('Completa todos los campos', 'error');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showMsg(data.error, 'error');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/profile.html';
      } catch {
        showMsg('Error de conexión', 'error');
      }
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!name || !email || !password) return showMsg('Completa todos los campos', 'error');
      if (password.length < 8) return showMsg('La contraseña debe tener al menos 8 caracteres', 'error');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) return showMsg(data.error, 'error');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/profile.html';
      } catch {
        showMsg('Error de conexión', 'error');
      }
    }

    // Enter para enviar
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const isLogin = !document.getElementById('loginForm').classList.contains('hidden');
      isLogin ? login() : register();
    });
  </script>
</body>
</html>
